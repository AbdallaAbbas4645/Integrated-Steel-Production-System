<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Steel Production Management System</title>
    
<link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Integrated Steel Production and Operations Management System</h1>
    <p>Welcome to the Steel Production Management System.</p>

<section class="dashboard" id="login-section">
    <div class="card">
        <h2>Login</h2>

        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>

            <button type="submit">Login</button>
        </form>

        <p id="login-message"></p>
    </div>
</section>
    

<section class="dashboard" id="dashboard-section" hidden>
    <h2>Production Dashboard</h2>

    <div class="card">
        <h3>Melting Operations</h3>
        <button type="button" id="logout-btn">Logout</button>
        <p id="active-heats">Active Heats: 0</p>

        <form id="heat-form">
            <label for="heat-number">Heat Number</label>
            <input type="text" id="heat-number" required>

            <label for="furnace">Furnace</label>
            <select id="furnace" required>
                <option value="A">Furnace A</option>
                <option value="B">Furnace B</option>
            </select>

            <label for="weight">Weight (tons)</label>
            <input type="number" id="weight"
                   min="0.1" step="0.1" required>

            <label for="start-time">Start Time</label>
            <input type="datetime-local"
                   id="start-time" required>

            <button type="submit">Save Heat</button>
        </form>

        <h3>Recorded Heats</h3>
        <ul id="heat-list"></ul>
    </div>
</section>


<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>

</html>
